name: Build Android APK

# কিভাবে চলবে:
#  - কোড GitHub-এ push করলে নিজে থেকেই বিল্ড হবে
#  - অথবা Actions ট্যাব থেকে "Run workflow" চেপে ম্যানুয়ালি চালানো যাবে
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME / ANDROID_SDK_ROOT already set, platform 35 + build-tools
      # present), so no separate SDK-setup action is needed. Gradle uses it.

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avenbd-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
