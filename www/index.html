<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aven BD</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #0e1116;
      color: #e8eaed;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 340px; }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: #1f6feb; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #fff;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.6; color: #9aa0a6; margin: 0 0 24px; }
    button {
      background: #1f6feb; color: #fff; border: 0;
      padding: 13px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">A</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>অ্যাপটি চালাতে ইন্টারনেট সংযোগ প্রয়োজন। সংযোগ চালু করে আবার চেষ্টা করুন।</p>
    <button onclick="location.href='https://www.avenbd.shop/admin'">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
